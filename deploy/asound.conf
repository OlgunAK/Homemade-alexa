# INMP441 mikrofon + MAX98357A amfi (dtoverlay=googlevoicehat-soundcard)
# Kart adını `aplay -l` ile doğrulayın.
pcm.!default {
    type asym
    playback.pcm "plughw:CARD=sndrpigooglevoi,DEV=0"
    capture.pcm  "plughw:CARD=sndrpigooglevoi,DEV=0"
}
ctl.!default {
    type hw
    card sndrpigooglevoi
}
